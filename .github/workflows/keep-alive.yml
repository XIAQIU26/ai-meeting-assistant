name: Keep Pages Alive

on:
  schedule:
    # 每天 UTC 06:00 运行（北京时间 14:00）
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keep-alive

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keep-alive
          git diff --staged --quiet || git commit -m "chore: keep pages alive [skip ci]"
          git push

